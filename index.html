<!doctype html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-column study screen; each tab has its own hue (teal = холинергические, коралл = адренергические) */
/* Всегда тёмная тема, независимо от настроек телефона */
:root{
  --ink:#e9f0f2; --muted:#9fb0b7; --surface:#1b2328; --line:rgba(233,240,242,.10);
  --c-main:#3cc4ae; --c-tint:#0f2421; --c-soft:#17352f;
  --a-main:#ff8a66; --a-tint:#2a1813; --a-soft:#40231a;
  --on-main:#10181c; color-scheme:dark;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--f-body);color:var(--ink);background:var(--c-tint);transition:background .3s;-webkit-tap-highlight-color:transparent}
body.tab-a{background:var(--a-tint)}
.app{--main:var(--c-main);--tint:var(--c-tint);--soft:var(--c-soft);
  max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app.tab-a{--main:var(--a-main);--tint:var(--a-tint);--soft:var(--a-soft)}
h1{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.25;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--main)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);padding:5px;border-radius:16px}
.tabs button{font:600 15px/1.2 var(--f-body);border:0;border-radius:12px;padding:12px 8px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--main);color:var(--on-main)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:500 13px/1 var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 13px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--soft);border-color:transparent;color:var(--ink);font-weight:700}

.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta label{display:flex;align-items:center;gap:6px;cursor:pointer}
.meta input{accent-color:var(--main);width:16px;height:16px}
.bar{height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.bar div{height:100%;width:0;background:var(--main);border-radius:3px;transition:width .3s}

.card{background:var(--surface);border-radius:24px;padding:22px 22px 16px;min-height:300px;display:flex;flex-direction:column;gap:16px;cursor:pointer}
.tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--main)}
.q{font-size:21px;font-weight:700;line-height:1.35;text-wrap:balance}
.a{display:none;background:var(--tint);border-radius:16px;padding:14px 16px;font-size:16.5px;line-height:1.55;white-space:pre-line}
.card.open .a{display:block}
.hint{font-size:13px;color:var(--muted)}
.card.open .hint{display:none}
.mark{margin-top:auto;font-size:12.5px;color:var(--muted);text-align:right}
.mark a{font-weight:700;color:var(--main);text-decoration:none;border-bottom:1px solid currentColor}

.btns{display:flex;gap:10px}
.btns button{flex:1;font:700 16px/1 var(--f-body);padding:16px;border-radius:16px;cursor:pointer;border:2px solid var(--main)}
.primary{background:var(--main);color:var(--on-main)}
.ghost{background:transparent;color:var(--main)}
button:focus-visible,a:focus-visible{outline:3px solid var(--main);outline-offset:2px}

.done{align-items:flex-start;justify-content:center;cursor:default;gap:10px}
.done .big{font-family:var(--f-display);font-size:24px}
.done p{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=id=>document.getElementById(id);
const app=$("app"),card=$("card"),btns=$("btns"),chips=$("chips");
let tab="c",group="all",pool=[],queue=[],known=0,hard=new Set(),open=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function list(){return D.map((_,i)=>i).filter(i=>D[i][0]===tab&&(group==="all"||D[i][1]===group))}

function drawChips(){
  const n=D.filter(d=>d[0]===tab).length;
  let h='<button data-g="all" aria-pressed="'+(group==="all")+'">Все · '+n+'</button>';
  for(const k in G[tab]) h+='<button data-g="'+k+'" aria-pressed="'+(group===k)+'">'+G[tab][k]+'</button>';
  chips.innerHTML=h;
}
chips.onclick=e=>{const b=e.target.closest("button");if(!b)return;group=b.dataset.g;drawChips();start(list())};

$("tabs").onclick=e=>{
  const b=e.target.closest("button");if(!b||b.dataset.tab===tab)return;
  tab=b.dataset.tab;group="all";
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  app.classList.toggle("tab-a",tab==="a");document.body.classList.toggle("tab-a",tab==="a");
  drawChips();start(list());
};

function start(l){pool=l;queue=$("shuf").checked?shuffle([...l]):[...l];known=0;hard=new Set();render()}
function prog(){const t=pool.length;$("ptext").textContent="Выучено "+known+" из "+t+(hard.size?" · сложных "+hard.size:"");$("pbar").style.width=(t?known/t*100:0)+"%"}
const MARK='<div class="mark"><a href="https://t.me/sidikoffarhod" target="_blank" rel="noopener">@sidikoffarhod</a> — репетитор по фармакологии</div>';

function render(){
  prog();open=false;
  if(!queue.length){
    card.className="card done";
    card.innerHTML='<div class="big">Готово</div><p>С первого раза: '+(pool.length-hard.size)+' из '+pool.length+'</p>'+MARK;
    btns.innerHTML=(hard.size?'<button class="ghost" id="hardonly">Только сложные</button>':'')+'<button class="primary" id="again">Ещё раз</button>';
    $("again").onclick=()=>start(list());
    if(hard.size)$("hardonly").onclick=()=>start([...hard]);
    return;
  }
  const d=D[queue[0]];
  card.className="card";
  card.innerHTML='<span class="tag">'+G[d[0]][d[1]]+'</span><div class="q">'+esc(d[2])+'</div><div class="a">'+esc(d[3])+'</div><div class="hint">Нажмите, чтобы увидеть ответ</div>'+MARK;
  btns.innerHTML='<button class="primary" id="show">Показать ответ</button>';
  $("show").onclick=reveal;
}
function reveal(){
  if(open||!queue.length)return;open=true;card.classList.add("open");
  btns.innerHTML='<button class="ghost" id="rep">Повторить</button><button class="primary" id="ok">Знаю</button>';
  $("rep").onclick=again;$("ok").onclick=know;
}
function know(){queue.shift();known++;render()}
function again(){hard.add(queue[0]);queue.push(queue.shift());render()}
const tg=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.platform!=="unknown"?window.Telegram.WebApp:null;
function tgColor(){if(!tg)return;const c=tab==="a"?"#2a1813":"#0f2421";try{tg.setHeaderColor(c);tg.setBackgroundColor(c)}catch(e){}}
if(tg){try{tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes()}catch(e){}tgColor()}
$("tabs").addEventListener("click",tgColor);
card.onclick=e=>{
  const a=e.target.closest("a");
  if(a){if(tg){e.preventDefault();tg.openTelegramLink(a.href)}return}
  if(!card.classList.contains("done"))reveal()
};
$("shuf").onchange=()=>start(list());
document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();reveal()}else if(open&&e.key==="1")again();else if(open&&e.key==="2")know()});
drawChips();start(list());
</script>
